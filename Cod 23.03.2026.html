<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Responsive Full-Width</title>
    <link rel="stylesheet" href="Cod 23 03 2026.css" />
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <button
        class="menu-toggle"
        aria-label="Meniu mobil"
        aria-expanded="false"
      >
        ☰
      </button>
      <div class="nav-links">
        <a href="#">Acasă</a>
        <a href="#">Despre</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <aside
      class="sidebar"
      id="sidebar"
      role="navigation"
      aria-label="Sidebar principal"
    >
      <a href="#">Dashboard</a>
      <a href="#">Profil</a>
      <a href="#">Setări</a>
      <a href="#">Ajutor</a>
    </aside>
    <div class="parinte">
      <div class="clip">
        <video controls>
          <source src="15461583_3840_2160_25fps.mp4" type="video/mp4" />
        </video>
      </div>
      
    </div>
    <p>Descriere clip</p>
    <script>
      const menuToggle = document.querySelector(".menu-toggle");
      const sidebar = document.getElementById("sidebar");
      const navLinks = document.querySelector(".nav-links");

      menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("active");
        navLinks.classList.toggle("active");
        const expanded = menuToggle.getAttribute("aria-expanded") === "true";
        menuToggle.setAttribute("aria-expanded", !expanded);
      });
    </script>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube-nocookie.com/embed/46rU1HUhNsc?si=1M9ItwynJZ7MBBnn"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
