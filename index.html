<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="card">
      <div class="contur">
        <img src="assets\images\illustration-article.svg" />
        <section class="learn">Learning</section>
        <section class="publish">Published 21 Dec 2023</section>
        <section class="fundatie">HTML & CSS foundations</section>
        <section class="baza">
          These languages are the backbone of every website, defining structure,
          content and presentation.
        </section>
        <section class="descriere">
          <img class="avatar" src="assets/images/image-avatar.webp" />
          Greg Hooper
        </section>
      </div>
    </div>

    <style>
      :root {
  --fundal: hsl(47, 88%, 63%);
}

@font-face {
  font-family: Fonty-Bold;
  src: url("fonts/Figtree-ExtraBold.ttf");
}
@font-face {
  font-family: Fonty-Medium;
  src: url("fonts/Figtree-Medium.ttf");
}

body {
  background-color: var(--fundal);
  display: flex;
}

.card {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 90vh;
  min-width: 100%;
}

.contur {
  background-color: hsl(0, 0%, 100%);
  border: 0.5px black solid;
  border-radius: 10px;
  box-shadow: 5px 5px black;
}

img {
  width: 200px;
  height: 150px;
  margin-left: 15px;
  margin-right: 15px;
}

.learn {
  background-color: var(--fundal);
  width: 25%;
  padding: 4px;
  margin-bottom: 10px;
  margin-left: 10px;
  font-family: Fonty-Bold;
  border-radius: 4px;
  font-size: small;
}

.publish {
  margin-left: 10px;
  font-family: Fonty-Medium;
  font-size: small;
}

.fundatie {
  margin-top: 10px;
  margin-left: 10px;
  font-family: Fonty-Bold;
}
.baza {
  font-size: x-small;
  width: 200px;
  height: 100px;
  margin-top: 10px;
  font-family: Fonty-Medium;
  margin-left: 10px;
  color: gray;
}

.avatar {
  width: 20px;
  height: 20px;
}
.descriere {
  font-family: Fonty-Bold;
  display: inline-flex;
  font-size: x-small;
}

    </style>
  </body>
</html>
