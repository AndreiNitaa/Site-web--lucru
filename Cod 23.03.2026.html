<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Responsive Full-Width</title>
    <link rel="stylesheet" href="Cod 01 04 2026.css" />
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <button
        class="menu-toggle"
        aria-label="Meniu mobil"
        aria-expanded="false"
      >
        ☰
      </button>
      <div class="nav-links">
        <a href="/">Acasă</a>
        <a href="/">Despre</a>
        <a href="/">Contact</a>
      </div>
    </nav>

    <aside
      class="sidebar"
      id="sidebar"
      role="navigation"
      aria-label="Sidebar principal"
    >
      <a href="#">Dashboard</a>
      <a href="#">Profil</a>
      <a href="#">Setări</a>
      <a href="#">Ajutor</a>
    </aside>
    <div class="centrat">
      <!-- <div class="animation"> -->
      Animatie

      <div class="card" :style="cardStyle(card)">
        <div
          class="main"
          :style="{ background: getBackground(card.main) }"
        ></div>
        <img src="stack.svg" />
        <img src="shield.svg" />
        <img src="sword.svg" />
        <img src="getBack.svg" />
        <img src="topDiscard.svg" />
        <img src="slash.svg" />
        <div class="tails">
          <div class="tail" :style="{ background: getBackground(t) }"></div>
        </div>
      </div>
    </div>

    <script>
      const menuToggle = document.querySelector(".menu-toggle");
      const sidebar = document.getElementById("sidebar");
      const navLinks = document.querySelector(".nav-links");

      menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("active");
        navLinks.classList.toggle("active");
        const expanded = menuToggle.getAttribute("aria-expanded") === "true";
        menuToggle.setAttribute("aria-expanded", !expanded);
      });
    </script>
  </body>
</html>
